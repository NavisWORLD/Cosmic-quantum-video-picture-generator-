name: COSMOS Media CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,media,test]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest
      - name: Smoke image
        run: cosmos-media image --prompt "CI cosmic garden" --seed 123 --width 320 --height 180 --out out/ci.png
      - name: Doctor
        run: cosmos-media doctor

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        working-directory: native/rust
        run: cargo fmt --check
      - name: Test
        working-directory: native/rust
        run: cargo test --all-targets

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native/cpp -B native/cpp/build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build native/cpp/build --config Release
      - name: Test
        run: ctest --test-dir native/cpp/build --output-on-failure
