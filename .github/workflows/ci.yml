name: COSMOS Media CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system media dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,media,test]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest
      - name: Smoke image
        run: cosmos-media image --prompt "CI cosmic garden" --seed 123 --width 320 --height 180 --out out/ci.png
      - name: Smoke stitched video
        run: cosmos-media video --prompt "CI continuous cosmic garden" --seed 321 --duration 1.0 --chunk-seconds 0.5 --overlap-seconds 0.1 --fps 12 --width 320 --height 180 --out out/ci-video.mp4
      - name: Smoke storybook
        run: cosmos-media storybook --context-file examples/story_context.txt --pages 2 --seed 777 --out out/ci-storybook
      - name: Verify media artifacts
        run: |
          test -s out/ci.png
          test -s out/ci-video.mp4
          test -s out/ci-storybook/page-001.png
          test -s out/ci-storybook/page-002.png
          test -s out/ci-storybook/BOOK.md
      - name: Doctor
        run: cosmos-media doctor

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        working-directory: native/rust
        run: cargo fmt --check
      - name: Test
        working-directory: native/rust
        run: cargo test --all-targets

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native/cpp -B native/cpp/build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build native/cpp/build --config Release
      - name: Test
        run: ctest --test-dir native/cpp/build --output-on-failure
