name: COSMOS Media CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system media dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,media,test]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest
      - name: Verify default provider and model
        run: |
          cosmos-media status > out-status.json
          cosmos-media models default > out-model.json
          grep '"provider": "native"' out-status.json
          grep '"default_model": "cosmos-main"' out-model.json
          grep 'phera-ra/QC67_cosmo' out-model.json
      - name: Smoke native image
        run: cosmos-media image --prompt "a luminous world tree above an alien ocean with floating islands and an observatory" --context "two moons, deep space, living memory" --seed 123 --width 640 --height 360 --out out/ci-native.png
      - name: Smoke COSMOS Main image edit
        run: cosmos-media edit-image --input out/ci-native.png --prompt "warm cinematic neon moonlight" --model cosmos-main --strength 0.70 --out out/ci-edited.png
      - name: Smoke native stitched video
        run: cosmos-media video --prompt "a continuous flight through a luminous cosmic garden above an alien ocean" --context "floating islands, world tree, stars, reflections" --seed 321 --duration 1.0 --chunk-seconds 0.5 --overlap-seconds 0.1 --fps 12 --width 320 --height 180 --out out/ci-native-video.mp4
      - name: Smoke native video edit
        run: cosmos-media edit-video --input out/ci-native-video.mp4 --prompt "cool cinematic electric night" --model native-edit --strength 0.55 --out out/ci-edited-video.mp4
      - name: Smoke native storybook
        run: cosmos-media storybook --context-file examples/story_context.txt --pages 2 --seed 777 --out out/ci-native-storybook
      - name: Smoke JSONL bridge
        run: |
          printf '%s\n' '{"id":"caps","op":"capabilities"}' '{"id":"models","op":"models"}' '{"id":"plan","op":"plan","prompt":"continue the luminous world"}' | cosmos-media bridge --stdio > out/ci-bridge.jsonl
          grep '"ok":true' out/ci-bridge.jsonl
          grep 'cosmos-main' out/ci-bridge.jsonl
      - name: Verify media artifacts
        run: |
          test -s out/ci-native.png
          test -s out/ci-edited.png
          test -s out/ci-native-video.mp4
          test -s out/ci-edited-video.mp4
          test -s out/ci-native-storybook/page-001.png
          test -s out/ci-native-storybook/page-002.png
          test -s out/ci-native-storybook/BOOK.md
          test -s out/ci-bridge.jsonl
          test -s out-model.json
          if cmp -s out/ci-native.png out/ci-edited.png; then
            echo "edited image unexpectedly identical"
            exit 1
          fi
      - name: Doctor
        run: cosmos-media doctor
      - name: Upload native proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-native-proof-${{ github.sha }}
          if-no-files-found: warn
          path: |
            out/ci-native.png
            out/ci-edited.png
            out/ci-native-video.mp4
            out/ci-edited-video.mp4
            out/ci-native-storybook/
            out/ci-bridge.jsonl
            out-status.json
            out-model.json

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        working-directory: native/rust
        run: cargo fmt --check
      - name: Test
        working-directory: native/rust
        run: cargo test --all-targets

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native/cpp -B native/cpp/build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build native/cpp/build --config Release
      - name: Test
        run: ctest --test-dir native/cpp/build --output-on-failure
