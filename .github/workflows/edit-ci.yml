name: COSMOS Media Edit CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  edit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install edit test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[media,test]"
      - name: Run media edit contract tests
        run: pytest -q tests/test_models.py tests/test_editing.py
