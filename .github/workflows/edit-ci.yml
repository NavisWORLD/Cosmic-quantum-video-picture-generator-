name: COSMOS Media Edit CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  edit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install edit test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[media,test]"
      - name: Compile Python edit stack
        run: python -m compileall -q src/cosmos_media
      - name: Run media edit contract tests
        run: pytest -q tests/test_models.py tests/test_controller.py tests/test_editing.py tests/test_edit_integrator.py
      - name: Verify CLI edit surfaces
        run: |
          cosmos-media edit-image --help | grep -- '--mask'
          cosmos-media edit-video --help | grep -- '--chunk-seconds'
          cosmos-media edit-video --help | grep -- '--temporal-blend'
          cosmos-media models --help >/dev/null
      - name: Verify shared app JavaScript syntax
        run: node --check apps/pwa/app.js
      - name: Verify shared app controls exist
        run: |
          grep 'id="maskFile"' apps/pwa/index.html
          grep 'id="editChunkSeconds"' apps/pwa/index.html
          grep 'id="styleLock"' apps/pwa/index.html
          grep 'id="temporalBlend"' apps/pwa/index.html
