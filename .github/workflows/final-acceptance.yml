name: COSMOS v0.3 Final Acceptance

on:
  push:
    branches: ["main", "agent/media-edit-model-stack"]
  pull_request:

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install COSMOS and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e ".[server,media,desktop,test]"
      - name: Compile and test
        run: |
          python -m compileall -q src
          pytest -q
          node --check apps/pwa/app.js
          python -c "from cosmos_media.api import app; assert app.title == 'COSMOS Quantum Media API'"
      - name: Verify COSMOS Main and renderer disclosure
        run: |
          mkdir -p out
          cosmos-media models default > out-model.json
          cosmos-media models list > out-models.json
          grep '"default_model": "cosmos-main"' out-model.json
          grep 'phera-ra/QC67_cosmo' out-model.json
          grep 'diffusers-edit' out-models.json
          grep 'Qwen/Qwen-Image-Edit-2511' out-models.json
      - name: Generate source and edit image with mask
        run: |
          cosmos-media image --prompt "luminous observatory above an alien ocean" --context "two moons and floating islands" --seed 8675309 --width 320 --height 180 --out out/e2e-source.png
          python - <<'PY'
          from PIL import Image
          source = Image.open('out/e2e-source.png')
          mask = Image.new('L', source.size, 0)
          for x in range(source.width // 2):
              for y in range(source.height):
                  mask.putpixel((x, y), 255)
          mask.save('out/e2e-mask.png')
          PY
          cosmos-media edit-image --input out/e2e-source.png --mask out/e2e-mask.png --prompt "warm cinematic neon moonlight" --model cosmos-main --strength 0.70 --out out/e2e-edited.png > out/e2e-image-result.json
          test -s out/e2e-source.png
          test -s out/e2e-mask.png
          test -s out/e2e-edited.png
          grep '"model": "cosmos-main"' out/e2e-image-result.json
          grep '"renderer": "native"' out/e2e-image-result.json
          grep 'phera-ra/QC67_cosmo' out/e2e-image-result.json
          python - <<'PY'
          from PIL import Image, ImageChops
          source = Image.open('out/e2e-source.png').convert('RGB')
          edited = Image.open('out/e2e-edited.png').convert('RGB')
          box = (source.width // 2, 0, source.width, source.height)
          assert ImageChops.difference(source.crop(box), edited.crop(box)).getbbox() is None
          assert ImageChops.difference(source.crop((0, 0, source.width // 2, source.height)), edited.crop((0, 0, source.width // 2, source.height))).getbbox() is not None
          PY
      - name: Generate and edit video
        run: |
          cosmos-media video --prompt "slow drift through the observatory" --context "stable scene" --seed 42 --duration 0.6 --chunk-seconds 0.6 --overlap-seconds 0 --fps 8 --width 192 --height 108 --out out/e2e-source.mp4
          cosmos-media edit-video --input out/e2e-source.mp4 --prompt "cool cinematic electric night" --model native-edit --strength 0.55 --chunk-seconds 0.3 --temporal-blend 0.10 --out out/e2e-edited.mp4 > out/e2e-video-result.json
          test -s out/e2e-source.mp4
          test -s out/e2e-edited.mp4
          grep '"model": "native-edit"' out/e2e-video-result.json
          grep '"renderer": "native"' out/e2e-video-result.json
          grep '"chunk_seconds": 0.3' out/e2e-video-result.json
          grep '"temporal_blend": 0.1' out/e2e-video-result.json
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1 out/e2e-edited.mp4 | grep codec_name
      - name: Bridge doctor and receipts
        run: |
          cosmos-media bridge --request '{"id":"models","op":"models"}' > out/e2e-bridge.json
          cosmos-media capabilities > out/e2e-capabilities.json
          grep 'cosmos-main' out/e2e-bridge.json
          grep 'temporal_blend' out/e2e-capabilities.json
          grep 'mask' out/e2e-capabilities.json
          cosmos-media doctor > out/e2e-doctor.json
          test -d .cosmos-media/receipts
          test "$(find .cosmos-media/receipts -type f -name 'edit-*.json' | wc -l)" -ge 2
          grep -R 'cosmos-media-edit/1' .cosmos-media/receipts
          grep -R 'mask_sha256' .cosmos-media/receipts
      - name: Upload final proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-v0.3-final-acceptance-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/e2e-source.png
            out/e2e-mask.png
            out/e2e-edited.png
            out/e2e-source.mp4
            out/e2e-edited.mp4
            out/e2e-image-result.json
            out/e2e-video-result.json
            out/e2e-bridge.json
            out/e2e-capabilities.json
            out/e2e-doctor.json
            out-model.json
            out-models.json
            .cosmos-media/receipts/
