name: COSMOS Media Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cosmos-media-linux-x86_64
            source: dist/cosmos-media
            output: dist/cosmos-media-linux-x86_64
          - os: windows-latest
            artifact: cosmos-media-windows-x86_64
            source: dist/cosmos-media.exe
            output: dist/cosmos-media-windows-x86_64.exe
          - os: macos-latest
            artifact: cosmos-media-macos-universal-host
            source: dist/cosmos-media
            output: dist/cosmos-media-macos-universal-host
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,media,desktop]"
      - name: Build executable
        run: python scripts/build_desktop.py
      - name: Rename artifact
        shell: bash
        run: mv "${{ matrix.source }}" "${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
