name: COSMOS Media Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: cosmos-media-v0.2.0-release
  cancel-in-progress: false

env:
  COSMOS_VERSION: "0.2.0"
  COSMOS_TAG: "v0.2.0"

jobs:
  windows:
    name: Windows one-click installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,media,desktop]"
      - name: Build installer
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1 -Version $env:COSMOS_VERSION
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist/installer/COSMOS-Media-Setup-Windows-x86_64.exe release-assets/
          Copy-Item dist/cosmos-media.exe release-assets/COSMOS-Media-CLI-Windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  macos:
    name: macOS app and DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,media,desktop]"
      - name: Build app and DMG
        run: bash scripts/build_macos.sh "$COSMOS_VERSION"
      - name: Stage release files
        run: |
          mkdir -p release-assets
          cp dist/COSMOS-Media-macOS.dmg release-assets/
          cp dist/COSMOS-Media-macOS.app.zip release-assets/
          cp dist/cosmos-media release-assets/COSMOS-Media-CLI-macOS
          chmod +x release-assets/COSMOS-Media-CLI-macOS
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/*
          if-no-files-found: error

  linux:
    name: Linux desktop and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,media,desktop]"
      - name: Build binaries
        run: python scripts/build_desktop.py
      - name: Package Linux distribution
        run: |
          mkdir -p release-assets/COSMOS-Media-Linux-x86_64
          cp dist/COSMOS-Media release-assets/COSMOS-Media-Linux-x86_64/
          cp dist/cosmos-media release-assets/COSMOS-Media-Linux-x86_64/
          cp README.md LICENSE NOTICE.md release-assets/COSMOS-Media-Linux-x86_64/
          chmod +x release-assets/COSMOS-Media-Linux-x86_64/COSMOS-Media release-assets/COSMOS-Media-Linux-x86_64/cosmos-media
          tar -C release-assets -czf release-assets/COSMOS-Media-Linux-x86_64.tar.gz COSMOS-Media-Linux-x86_64
          rm -rf release-assets/COSMOS-Media-Linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/COSMOS-Media-Linux-x86_64.tar.gz
          if-no-files-found: error

  android:
    name: Android application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android project and branded assets
        working-directory: apps/mobile
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#090b17' --iconBackgroundColorDark '#090b17' --splashBackgroundColor '#090b17' --splashBackgroundColorDark '#090b17'
          npx cap sync android
      - name: Build Android APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Stage Android app
        run: |
          mkdir -p release-assets
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk release-assets/COSMOS-Media-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/COSMOS-Media-Android.apk
          if-no-files-found: error

  ios:
    name: iPhone application project and simulator app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Generate iOS project and branded assets
        working-directory: apps/mobile
        run: |
          npx cap add ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#090b17' --iconBackgroundColorDark '#090b17' --splashBackgroundColor '#090b17' --splashBackgroundColorDark '#090b17'
          npx cap sync ios
      - name: Build unsigned iOS Simulator app
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$(find ios-build/Build/Products -type d -name 'App.app' | head -1)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" COSMOS-Media-iOS-Simulator.app.zip
          ditto -c -k --sequesterRsrc --keepParent ios COSMOS-Media-iOS-Xcode-Project.zip
      - name: Stage iOS files
        run: |
          mkdir -p release-assets
          cp apps/mobile/COSMOS-Media-iOS-Simulator.app.zip release-assets/
          cp apps/mobile/COSMOS-Media-iOS-Xcode-Project.zip release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Package GitHub Release
    needs: [windows, macos, linux, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release tag if needed
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.COSMOS_TAG;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`${tag} already exists; keeping the immutable release tag.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha });
              core.info(`Created ${tag} at ${context.sha}`);
            }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.COSMOS_TAG }}
          name: COSMOS Media v${{ env.COSMOS_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## COSMOS Media v0.2.0

            Cross-platform packaged release of the standalone COSMOS image/video/storybook engine and integration bridge.

            ### Desktop
            - Windows one-click installer: `COSMOS-Media-Setup-Windows-x86_64.exe`
            - macOS disk image: `COSMOS-Media-macOS.dmg`
            - macOS app archive: `COSMOS-Media-macOS.app.zip`
            - Linux distribution: `COSMOS-Media-Linux-x86_64.tar.gz`
            - Windows/macOS CLI binaries are included separately.

            ### Mobile
            - Android installable APK: `COSMOS-Media-Android.apk`
            - iOS Simulator application archive
            - generated iOS Xcode project for physical-device/App Store signing
            - the same UI remains directly installable as a PWA on iPhone/Android.

            Physical iPhone/App Store installation requires Apple signing and provisioning credentials owned by the publisher; no private signing material is committed to the repository.
          files: release-assets/*
          fail_on_unmatched_files: true
