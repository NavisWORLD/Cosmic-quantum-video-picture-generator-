name: COSMOS SDK CI

on:
  push:
    branches: [main]
    paths: ["sdk/**", "native/c_abi/**", "src/cosmos_media/synaptic.py", ".github/workflows/sdk-ci.yml"]
  pull_request:
    paths: ["sdk/**", "native/c_abi/**", "src/cosmos_media/synaptic.py", ".github/workflows/sdk-ci.yml"]

jobs:
  sdk-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e .
      - run: python -c "from cosmos_media import SynapticCore; c=SynapticCore.from_context('ci'); assert c.pulse('next')['step_index']==1"
      - run: cargo check --manifest-path sdk/rust/Cargo.toml
      - run: cmake -S native/c_abi -B build/cabi && cmake --build build/cabi --config Release
      - run: c++ -std=c++17 -I. sdk/cpp/smoke.cpp native/cpp/src/cosmos_media.cpp -o /tmp/cosmos-sdk && /tmp/cosmos-sdk
      - run: go test ./...
        working-directory: sdk/go
      - run: node --input-type=module -e "import {SynapticCore} from './sdk/typescript/index.mjs'; const c=new SynapticCore('ci'); c.advance('next'); if(c.step!==1) process.exit(1)"
      - run: javac -d build/java sdk/java/CosmosSynaptic.java
      - run: dotnet build sdk/csharp/CosmosSynaptic.csproj -c Release

  sdk-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path sdk/swift
