[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-quantum-media"
version = "0.3.0"
description = "COSMOS/CST stateful media engine with cross-language Synaptic SDKs, native rendering, and optional IBM Quantum provenance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Cory Davis / NavisWORLD"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
server = ["fastapi>=0.116", "uvicorn>=0.35", "pydantic>=2.11"]
media = ["Pillow>=10.4", "httpx>=0.28"]
quantum = ["qiskit>=2.0", "qiskit-ibm-runtime>=0.42"]
test = ["pytest>=8.3"]
desktop = ["pyinstaller>=6.14", "imageio-ffmpeg>=0.6"]
all = [
  "fastapi>=0.116", "uvicorn>=0.35", "pydantic>=2.11",
  "Pillow>=10.4", "httpx>=0.28",
  "qiskit>=2.0", "qiskit-ibm-runtime>=0.42",
  "pytest>=8.3", "pyinstaller>=6.14", "imageio-ffmpeg>=0.6"
]

[project.scripts]
cosmos-media = "cosmos_media.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
